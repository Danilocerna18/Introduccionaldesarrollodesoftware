<h2>Skills</h2>

<ul>
  <li *ngFor="let skill of skills">
    {{ skill | capitalize }}
  </li>
</ul>


    <section id="skills" class="section">
      <h2>Skills</h2>
      <div class="skills">
        <div class="skill">
          <div class="skill-title"><span>Python</span><span>90%</span></div>
          <div class="skill-bar"><div class="skill-fill" data-width="90%"></div></div>
        </div>

        <div class="skill">
          <div class="skill-title"><span>HTML / CSS</span><span>75%</span></div>
          <div class="skill-bar"><div class="skill-fill" data-width="75%"></div></div>
        </div>

        <div class="skill">
          <div class="skill-title"><span>Infraestructura</span><span>60%</span></div>
          <div class="skill-bar"><div class="skill-fill" data-width="60%"></div></div>
        </div>

        <div class="skill">
          <div class="skill-title"><span>Circuitos</span><span>85%</span></div>
          <div class="skill-bar"><div class="skill-fill" data-width="85%"></div></div>
        </div>
      </div>
    </section>
